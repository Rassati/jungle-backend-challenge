name: jungle-backend-challenge

services:
  migrate:
    profiles: ['app']
    build: .
    image: jungle-backend-challenge:local
    command: ['bun', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://jungle:jungle-local-only@postgres:5432/jungle
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build: .
    image: jungle-backend-challenge:local
    environment:
      DATABASE_URL: postgresql://jungle:jungle-local-only@postgres:5432/jungle
      TEST_ADMIN_DATABASE_URL: postgresql://jungle:jungle-local-only@postgres:5432/jungle
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle-local-only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle']
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '127.0.0.1:4566:4566'
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null && awslocal sqs get-queue-url --queue-name wager-events.fifo >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
